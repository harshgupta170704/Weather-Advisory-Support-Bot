    - should I commute
    - go out
    - head to work
    - road trip
  conditions:
    precipitation_probability:
      gte: 70
  advice: >
    Travel plans may be affected. The precipitation probability is
    {precipitation_probability}% with expected rainfall of
    {precipitation_mm} mm. If using a two-wheeler or walking,
