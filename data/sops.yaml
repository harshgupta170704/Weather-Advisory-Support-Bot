- id: "SOP-013"
  title: "Combined Adverse Conditions — General Outdoor Activity"
  category: "outdoor_exercise"
  severity: "HIGH"
  priority: 80
  description: >
    When multiple weather factors are simultaneously unfavorable
    (heat + wind, rain + cold, etc.), the combined effect is worse
    than any single factor alone.
  activities:
    - outdoor
    - exercise
    - travel
    - commute
    - cycling
    - running
    - walking
    - park
    - picnic
    - outing
  intent_hints:
    - go outside
    - any outdoor activity
    - head out
    - outdoor plans
  conditions:
    # Requires ALL conditions to be met (combined stress)
    temperature_c:
      gte: 35
    wind_speed_kmh:
      gte: 30
  advice: >
    Multiple adverse conditions are present simultaneously.
    Temperature is {temperature_c}°C and wind speed is
    {wind_speed_kmh} km/h. The combination of heat and wind
    increases dehydration and fatigue risk. Postpone outdoor
    activities until conditions improve.
  fallback_message: "Multiple adverse conditions — avoid outdoor activities."
  reason: "Combined adverse weather factors increase overall risk."

