# ============================================================
# ClimaGuard — Standard Operating Procedures (SOPs)
# ============================================================
# Each SOP is a self-contained policy rule. The deterministic
# policy engine evaluates every SOP against live weather data
# and the user's parsed intent. The LLM never decides safety.
#
# TO ADD A NEW SOP:
#   1. Append a new entry below with a unique id (e.g. SOP-016).
#   2. No code changes are required — the engine auto-loads it.
# ============================================================

- id: "SOP-001"
  title: "Strong Winds — Cycling & Two-Wheelers"
  category: "outdoor_exercise"
  severity: "HIGH"
  priority: 90
  description: >
    High wind speeds make cycling and two-wheeler travel dangerous
    due to loss of balance and reduced vehicle control.
  activities:
    - cycling
    - biking
    - bike
    - bicycle
    - two_wheeler
    - scooter
    - motorcycle
    - motorbike
  intent_hints:
    - ride my bike
    - cycle to work
    - take my scooter
    - commute by bike
    - go for a ride
  conditions:
    wind_speed_kmh:
      gte: 40
  advice: >
    Cycling and two-wheeler travel is not recommended. Wind speeds
    of {wind_speed_kmh} km/h with gusts up to {wind_gusts_kmh} km/h
    significantly increase the risk of accidents. Consider using
    enclosed transport or postponing your trip.
  fallback_message: "Avoid cycling or two-wheeler travel in strong winds."
  reason: "Wind speed exceeds safe threshold for two-wheeled vehicles."

- id: "SOP-002"
